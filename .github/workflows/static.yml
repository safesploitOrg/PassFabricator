name: Reviewed Pages deployment

# Production deployment is a separate owner action. Re-run every mandatory
# check for the exact approved commit; never deploy from an independent push.
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: 'Full 40-character SHA reviewed and approved by the human project owner'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  approval:
    name: Check approved source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the approved main-branch revision
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$APPROVED_COMMIT" = "$GITHUB_SHA"
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]

  verify:
    needs: approval
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy approved artifact
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the artifact built by the verified workflow
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
